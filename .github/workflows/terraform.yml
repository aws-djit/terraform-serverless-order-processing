
name: Terraform AWS Deployment

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Debug GitHub context
      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Branch Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"

      # Step 3: Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # Step 4: Verify AWS authentication
      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      # Step 5: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 6: Terraform initialization
      - name: Terraform Init
        run: terraform init

      # Step 7: Terraform formatting check
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 8: Terraform validation
      - name: Terraform Validate
        run: terraform validate

      # Step 9: Terraform plan
      - name: Terraform Plan
        run: terraform plan
